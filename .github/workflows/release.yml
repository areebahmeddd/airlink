name: Release and Changelog

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        board:
          - heltec_v4
          - heltec_v4_r8
          - heltec_v3
          - tbeam_supreme
          - xiao_s3_wio
          - c6_devkit
          - xiao_c6
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the version and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The OTA number has no room for a suffix
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -q "set(PROJECT_VER \"$version\")" CMakeLists.txt
          grep -q "^## \[$version\]" CHANGELOG.md

      - name: Build tools image
        run: docker build -t airlink-tools:dev docker

      - name: Build twice and compare
        run: |
          scripts/docker.sh 'scripts/build.sh ${{ matrix.board }} release'
          mv build/${{ matrix.board }}-release build/first
          scripts/docker.sh 'scripts/build.sh ${{ matrix.board }} release'
          cmp build/first/airlink.bin build/${{ matrix.board }}-release/airlink.bin
          cmp build/first/bootloader/bootloader.bin build/${{ matrix.board }}-release/bootloader/bootloader.bin

      - name: Write SBOM
        run: scripts/docker.sh 'esp-idf-sbom create --output-file build/${{ matrix.board }}-release/airlink-${{ matrix.board }}.spdx build/${{ matrix.board }}-release/project_description.json'

      - name: Collect outputs
        run: |
          out=release/${{ matrix.board }}
          b=build/${{ matrix.board }}-release
          mkdir -p "$out/bootloader" "$out/partition_table"
          cp "$b/airlink.bin" "$b/airlink.elf" "$b/ota_data_initial.bin" "$b/flash_args" \
            "$b/bootloader-flash_args" "$b/airlink-${{ matrix.board }}.spdx" "$out/"
          cp "$b/bootloader/bootloader.bin" "$out/bootloader/"
          cp "$b/partition_table/partition-table.bin" "$out/partition_table/"
          sums=$(cd "$out" && find . -type f | sort | xargs sha256sum)
          echo "$sums" > "$out/SHA256SUMS"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/${{ matrix.board }}/**/*.bin

      - name: Upload outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.board }}
          path: release/${{ matrix.board }}

  draft:
    name: Draft Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release

      - name: Archive each board and extract the release notes
        run: |
          cd release
          for b in */; do tar -czf "airlink-${GITHUB_REF_NAME}-${b%/}-unsigned.tar.gz" "$b"; done
          awk -v head="## [${GITHUB_REF_NAME#v}]" 'index($0, head) == 1 { on = 1; next } /^## \[/ { on = 0 } on' \
            ../CHANGELOG.md > notes.md

      # A draft of unsigned outputs: the keys never reach CI, so the maintainer
      # signs them offline and attaches them before publishing (docs/RELEASE.md).
      - name: Draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          body_path: release/notes.md
          files: release/*.tar.gz
